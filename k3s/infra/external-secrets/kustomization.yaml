# bitwarden-access-token and bitwarden-tls-certs are created by hand (README.md)
# and are deliberately not resources here.
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
generatorOptions:
  disableNameSuffixHash: true
  # Makes helm-controller upgrade the release as soon as the values change; without it, only the next interval notices.
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: external-secrets-values
    namespace: external-secrets
    files:
      - values.yaml=values.yaml
