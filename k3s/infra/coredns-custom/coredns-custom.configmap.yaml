# chimaera resolves DNS through 1.1.1.1 (not AdGuard), and the DMZ can't reach
# its own public address (no hairpin NAT). cert-manager's HTTP-01 self-check
# therefore times out unless the name resolves to the node itself. This makes
# every public name served by chimaera resolve to it inside the cluster;
# outside, DNS is unchanged. Add a new app's host here when it is migrated.
# k3s imports every `*.server` key as its own CoreDNS server block (the main
# block already uses `hosts`, which is allowed once per block).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  public-hosts.server: |
    music.$DOMAIN:53 nd.$DOMAIN:53 budget.$DOMAIN:53 audiobooks.$DOMAIN:53 miniflux.$DOMAIN:53 recipes.$DOMAIN:53 photos.$DOMAIN:53 {
      errors
      hosts {
        192.168.40.10 music.$DOMAIN nd.$DOMAIN budget.$DOMAIN audiobooks.$DOMAIN miniflux.$DOMAIN recipes.$DOMAIN photos.$DOMAIN
      }
    }
