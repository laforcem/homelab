apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: alertmanager-telegram
  data:
    - secretKey: bot-token
      remoteRef:
        key: 03a1ca0c-d1e3-40fc-a247-b4f000f69568 # alertmanager_telegram_bot_token
    - secretKey: chat-id
      remoteRef:
        key: dfab76bc-a91f-4246-8b64-b4f000f695ab # alertmanager_telegram_chat_id
