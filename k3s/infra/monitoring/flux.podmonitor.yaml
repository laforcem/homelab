# Flux controllers serve Prometheus metrics on container port 8080 ("http-prom").
# Scrapes the controllers themselves, so TargetDown notices a dead one. Per-object
# readiness and suspend state come from kube-state-metrics, not from here
# (see customResourceState in kube-prometheus-stack.values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - source-controller
          - kustomize-controller
          - helm-controller
          - notification-controller
  podMetricsEndpoints:
    - port: http-prom
      path: /metrics
