# Flux controllers serve Prometheus metrics on container port 8080 ("http-prom").
# Feeds the FluxObjectSuspended alert: a suspended object raises no event, so
# without this a forgotten suspend silently stops reconciliation.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - source-controller
          - kustomize-controller
          - helm-controller
          - notification-controller
  podMetricsEndpoints:
    - port: http-prom
      path: /metrics
