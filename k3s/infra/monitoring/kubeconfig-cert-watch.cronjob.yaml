# Alerts when chimaera's k3s admin client certificate changes (k3s renews it on
# restart within 120 days of expiry; a manual `k3s certificate rotate` does too).
# Downstream copies of the kubeconfig (local machine, dotfiles) are not renewed
# and must be refreshed by hand (#101). The job compares the cert file's hash
# with the one in ConfigMap kubeconfig-cert-watch and posts an alert to
# Alertmanager when they differ. The first run only records the hash.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeconfig-cert-watch
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeconfig-cert-watch
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"] # create can't be limited by resourceNames
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kubeconfig-cert-watch"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeconfig-cert-watch
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeconfig-cert-watch
subjects:
  - kind: ServiceAccount
    name: kubeconfig-cert-watch
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubeconfig-cert-watch
  namespace: monitoring
spec:
  schedule: "23 6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: kubeconfig-cert-watch
          restartPolicy: Never
          enableServiceLinks: false
          volumes:
            - name: tls
              hostPath:
                path: /var/lib/rancher/k3s/server/tls
                type: Directory
            - name: tmp
              emptyDir: {}
          containers:
            - name: watch
              image: alpine/k8s:1.36.5
              env:
                - name: HOME
                  value: /tmp
              command:
                - sh
                - -c
                - |
                  set -eu
                  new=$(sha256sum /tls/client-admin.crt | cut -d' ' -f1)
                  old=$(kubectl -n monitoring get configmap kubeconfig-cert-watch -o jsonpath='{.data.fingerprint}' 2>/dev/null || true)
                  if [ -z "$old" ]; then
                    kubectl -n monitoring create configmap kubeconfig-cert-watch --from-literal=fingerprint="$new"
                    exit 0
                  fi
                  [ "$new" = "$old" ] && exit 0
                  ends=$(date -u -d "@$(( $(date +%s) + 86400 ))" +%Y-%m-%dT%H:%M:%SZ)
                  # Alert first: if Alertmanager is down the job fails and retries tomorrow.
                  curl -fsS -X POST -H 'Content-Type: application/json' \
                    http://kube-prometheus-stack-alertmanager.monitoring:9093/api/v2/alerts \
                    -d '[{"labels":{"alertname":"KubeconfigCertRotated","severity":"warning"},"annotations":{"summary":"chimaera admin kubeconfig certificate was rotated.","description":"Refresh downstream copies: run ansible-playbook playbooks/main.yaml --limit chimaera, then re-sync the kubeconfig to dotfiles."},"endsAt":"'"$ends"'"}]'
                  kubectl -n monitoring patch configmap kubeconfig-cert-watch -p '{"data":{"fingerprint":"'"$new"'"}}'
              securityContext:
                runAsUser: 0 # /var/lib/rancher/k3s/server/tls is root-only
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
