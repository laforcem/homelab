# prometheus-blackbox-exporter 11.20.2, installed by Flux (blackbox.helmrelease.yaml).
# Probes the in-cluster apps (../app-probes.probe.yaml). ${DOMAIN} comes from the
# flux-system/flux-vars Secret.
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        preferred_ip_protocol: ip4
    # Tandoor's ALLOWED_HOSTS rejects the Service name, so send its real host.
    http_2xx_tandoor:
      prober: http
      timeout: 10s
      http:
        preferred_ip_protocol: ip4
        headers:
          Host: recipes.${DOMAIN}

resources:
  requests: { cpu: 5m, memory: 16Mi }
  limits: { memory: 64Mi }
