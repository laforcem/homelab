# grafana/loki 7.3.0 — single binary, filesystem storage, cluster logs only.
# Warden's Grafana queries it over NodePort 30100 (loki-nodeport.service.yaml).

deploymentMode: SingleBinary

loki:
  # One tenant. Warden's Grafana sends no X-Scope-OrgID header.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Without this the 10Gi volume fills and never recovers.
  limits_config:
    retention_period: 336h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# Scalable-mode components, caches and extras that a single node doesn't need.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
