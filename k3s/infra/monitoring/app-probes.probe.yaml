# One Probe per app, replacing the per-app health-probe CronJobs. AppDown (rules/alerts.prometheusrule.yaml)
# fires when probe_success is 0 for 5 minutes.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: audiobookshelf
  namespace: monitoring
spec:
  interval: 1m
  module: http_2xx
  prober:
    url: prometheus-blackbox-exporter.monitoring:9115
  targets:
    staticConfig:
      static:
        - http://audiobookshelf.audiobookshelf/healthcheck
---
apiVersion: monitoring.coreos.com/v1
