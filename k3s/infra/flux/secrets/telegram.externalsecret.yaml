apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-token
  namespace: flux-system
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: telegram-token
  data:
    - secretKey: token
      remoteRef:
        key: 03a1ca0c-d1e3-40fc-a247-b4f000f69568 # alertmanager_telegram_bot_token
