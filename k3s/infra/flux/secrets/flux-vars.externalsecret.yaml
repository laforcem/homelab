# Substitution variables for every Kustomization that sets
# postBuild.substituteFrom: flux-vars. Keeps the domain out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-vars
  namespace: flux-system
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: flux-vars
  data:
    - secretKey: DOMAIN
      remoteRef:
        key: 4d3bfd3c-0a5d-496e-8eeb-b4ab00128f57 # DOMAIN (same one doco-cd uses)
