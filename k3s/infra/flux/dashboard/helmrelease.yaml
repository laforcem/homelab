apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: flux-operator
  chart:
    spec:
      chart: flux-operator
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: flux-operator-values
      valuesKey: values.yaml
