# The dashboard's single identity (group flux-admin, see operator.values.yaml).
# Not the chart's flux-web-admin role: that one reads every resource, Secrets
# included, and this identity sits behind nothing but basic auth.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-web-operator
rules:
  # Read everything the dashboard shows, except Secrets.
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups:
      - apps
      - batch
      - networking.k8s.io
      - storage.k8s.io
      - policy
      - autoscaling
      - discovery.k8s.io
      - metrics.k8s.io
      - external-secrets.io
      - monitoring.coreos.com
      - volsync.backube
      - snapshot.storage.k8s.io
      - fluxcd.controlplane.io
      - source.toolkit.fluxcd.io
      - source.extensions.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: [get, list, watch]
  # Actions. With FineGrained access these verbs are all the identity needs.
  - apiGroups:
      - fluxcd.controlplane.io
      - source.toolkit.fluxcd.io
      - source.extensions.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: [reconcile, suspend, resume, download]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [restart]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [restart]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-operator
subjects:
  - kind: Group
    name: flux-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-operator
  apiGroup: rbac.authorization.k8s.io
