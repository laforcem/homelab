# Reached by warden's Caddy for flux.lan.${DOMAIN}. Local keeps the caller's
# real address so web.networkpolicy.yaml can restrict access to warden (ufw
# can't restrict NodePort traffic).
apiVersion: v1
kind: Service
metadata:
  name: flux-operator-web-nodeport
  namespace: flux-system
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: flux-operator
    app.kubernetes.io/instance: flux-operator
  ports:
    - port: 9080
      targetPort: 9080
      nodePort: 30200
