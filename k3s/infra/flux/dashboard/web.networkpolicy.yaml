# The NodePort bypasses ufw, so this policy limits who can reach port 9080 to
# warden and in-cluster traffic. It is not a per-client gate: anything running
# on warden, or tailnet traffic routed through warden, arrives as warden's
# address and never meets warden's basic auth. Any pod can also reach the
# ClusterIP service directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-operator-web-restricted
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/instance: flux-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.42.0.0/16 }       # pod network (incl. node gateway)
        - ipBlock: { cidr: 192.168.10.12/32 }   # warden
