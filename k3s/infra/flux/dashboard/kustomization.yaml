resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - web-rbac.yaml
  - web-nodeport.service.yaml
  - web.networkpolicy.yaml
generatorOptions:
  disableNameSuffixHash: true
  # Makes helm-controller upgrade the release as soon as the values change; without it, only the next interval notices.
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: flux-operator-values
    namespace: flux-system
    files:
      - values.yaml=operator.values.yaml
