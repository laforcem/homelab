apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-failures
  namespace: flux-system
spec:
  providerRef:
    name: telegram
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: "*"
