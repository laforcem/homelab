# Same Telegram chat as Alertmanager. The chat ID can't come from a Secret
# field, so the Kustomization substitutes it from flux-vars (wrapped in ${quote}
# so the numeric ID stays a string).
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: telegram
  namespace: flux-system
spec:
  type: telegram
  channel: ${quote}${TELEGRAM_CHAT_ID}${quote}
  secretRef:
    name: telegram-token
