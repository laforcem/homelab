# The boards are kept out of git: this repo is public and the board URLs name
# a personal Pinterest account. BOARDS is a JSON object of Immich album name ->
# board URL. IMMICH_API_KEY belongs to the Immich user who will own the albums.
# The cookies are a whole Netscape cookies.txt, mounted as a file; re-export
# them here when the session expires.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinterest-immich
  namespace: immich
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: pinterest-immich
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: ef5a8156-d891-49ab-8331-b500015436da
    - secretKey: PINTEREST_COOKIES
      remoteRef:
        key: dfdff709-73b0-4236-99d3-b50001543713
    - secretKey: BOARDS
      remoteRef:
        key: 9c1b3e74-e99a-4037-aef7-b5000154374a
