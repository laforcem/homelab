apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-backup-lab
  namespace: media-backup
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: media-backup-lab
  resources:
    requests:
      storage: 500Gi
