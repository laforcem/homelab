# Same Dropbox app and credentials as the VolSync restic secrets
# (k3s/apps/*/restic.externalsecret.yaml); this job just reads them as rclone
# env config. A pod can't persist a refreshed token, so it gets only the
# refresh token with an already-expired access token: every run refreshes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-dropbox
  namespace: media-backup
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: rclone-dropbox
    template:
      data:
        RCLONE_CONFIG_DROPBOX_TYPE: "dropbox"
        RCLONE_CONFIG_DROPBOX_CLIENT_ID: "{{ .clientId }}"
        RCLONE_CONFIG_DROPBOX_CLIENT_SECRET: "{{ .clientSecret }}"
        RCLONE_CONFIG_DROPBOX_TOKEN: '{{ $t := .dropboxToken | fromJson }}{"access_token":"","token_type":"bearer","refresh_token":"{{ $t.refresh_token }}","expiry":"2000-01-01T00:00:00Z"}'
  data:
    - secretKey: clientId
      remoteRef:
        key: 7c6af17a-edcb-4c28-9d8c-b4e900f9e531
    - secretKey: clientSecret
      remoteRef:
        key: f43adad0-c61b-472c-8088-b4e900fa03c9
    - secretKey: dropboxToken
      remoteRef:
        key: cba6d19d-fb5f-472e-a8da-b4e900fb2e43
