apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: miniflux
  namespace: miniflux
spec:
  sourcePVC: miniflux-dump
  trigger:
    schedule: "0 3 * * *"
  restic:
    repository: restic-config
    copyMethod: Direct
    pruneIntervalDays: 15
    retain:
      daily: 7
      weekly: 4
      monthly: 3
