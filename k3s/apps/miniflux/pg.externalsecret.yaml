apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-pg
  namespace: miniflux
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: miniflux-pg
    template:
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
        DATABASE_URL: "postgres://miniflux:{{ .password }}@postgres/miniflux?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: de98bd56-9273-425b-a12d-b4e90118735a # miniflux_pg_password
