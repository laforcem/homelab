apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: tandoor-media
  namespace: tandoor
spec:
  sourcePVC: tandoor-media
  trigger:
    schedule: "30 3 * * *"
  restic:
    repository: restic-config-media
    copyMethod: Direct
    pruneIntervalDays: 15
    retain:
      daily: 7
      weekly: 4
      monthly: 3
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: tandoor-dump
  namespace: tandoor
spec:
  sourcePVC: tandoor-dump
  trigger:
    schedule: "45 3 * * *"
  restic:
    repository: restic-config-dump
    copyMethod: Direct
    pruneIntervalDays: 15
    retain:
      daily: 7
      weekly: 4
      monthly: 3
