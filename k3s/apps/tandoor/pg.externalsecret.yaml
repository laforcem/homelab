apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-secrets
  namespace: tandoor
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: tandoor-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: d2971c28-2333-42ad-8b4a-b4e901241480 # tandoor_pg_password
    - secretKey: SECRET_KEY
      remoteRef:
        key: a42ba00f-aed0-4c77-ad40-b4e901245d68 # tandoor_secret_key
