apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: nd-simple-rpc-state
  namespace: navidrome
spec:
  sourcePVC: nd-simple-rpc-state
  trigger:
    schedule: "35 3 * * *"
  restic:
    repository: restic-config-rpc
    copyMethod: Direct
    pruneIntervalDays: 15
    retain:
      daily: 7
      weekly: 4
      monthly: 3
