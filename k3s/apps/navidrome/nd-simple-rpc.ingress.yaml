apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nd-simple-rpc
  namespace: navidrome
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - presence.music.$DOMAIN
      secretName: presence-tls
  rules:
    - host: presence.music.$DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nd-simple-rpc
                port:
                  name: public
