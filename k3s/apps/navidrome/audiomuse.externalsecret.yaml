apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiomuse
  namespace: navidrome
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: audiomuse
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: 68523d62-cb4b-474a-87b2-b4ec010b565f # audiomuse_postgres_password
    - secretKey: NAVIDROME_PASSWORD
      remoteRef:
        key: e4a77aef-0520-471f-8552-b4ec010b569e # audiomuse_navidrome_password
    - secretKey: AUDIOMUSE_PASSWORD
      remoteRef:
        key: db89feab-4833-4d8f-808b-b4ec010b56e5 # audiomuse_admin_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: 567a2bc8-5d83-4d79-a2dd-b4ec010b5729 # audiomuse_jwt_secret
    - secretKey: API_TOKEN
      remoteRef:
        key: 5b896254-8246-4dde-a019-b4ec010b5773 # audiomuse_api_token
