apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nd-simple-rpc
  namespace: navidrome
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: nd-simple-rpc
  data:
    - secretKey: DISCORD_CLIENT_ID
      remoteRef:
        key: 5c288561-3894-4b01-8833-b4ef015d132b # nd_simple_rpc_discord_client_id
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef:
        key: 8078403e-1315-433f-b6af-b4ef015d432f # nd_simple_rpc_discord_client_secret
    - secretKey: SHARED_SECRET
      remoteRef:
        key: d6b757cd-d395-4f6a-952c-b4ef015bfa4b # nd_simple_rpc_shared_secret
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: c7df8747-661d-4c79-8e55-b4ef015bfa83 # nd_simple_rpc_encryption_key
    - secretKey: SESSION_KEY
      remoteRef:
        key: 243c3faf-c08a-4055-acf1-b4ef015bfac4 # nd_simple_rpc_session_key
