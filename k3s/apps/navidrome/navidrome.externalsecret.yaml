apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome
  namespace: navidrome
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: navidrome
    template:
      data:
        ND_LASTFM_APIKEY: "{{ .lastfmKey }}"
        ND_LASTFM_SECRET: "{{ .lastfmSecret }}"
  data:
    - secretKey: lastfmKey
      remoteRef:
        key: 62613a14-63c4-4b3e-9380-b4ec010b4c17 # navidrome_lastfm_api_key
    - secretKey: lastfmSecret
      remoteRef:
        key: 239fc593-efa0-4a01-9304-b4ec010b5619 # navidrome_lastfm_secret
