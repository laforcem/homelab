# nd-simple-rpc's SQLite DB (linked Discord accounts). Must stay on local disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nd-simple-rpc-state
  namespace: navidrome
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
