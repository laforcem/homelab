apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-ai-worker
  namespace: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiomuse-ai-worker
  template:
    metadata:
      labels:
        app: audiomuse-ai-worker
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: ghcr.io/neptunehub/audiomuse-ai:3.6.4
          envFrom:
            - secretRef:
                name: audiomuse
          env:
            - name: SERVICE_TYPE
              value: worker
            - name: TZ
              value: America/Denver
            - name: POSTGRES_USER
              value: audiomuse
            - name: POSTGRES_DB
              value: audiomusedb
            - name: POSTGRES_HOST
              value: audiomuse-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_URL
              value: redis://audiomuse-redis:6379/0
            - name: TEMP_DIR
              value: /app/temp_audio
            - name: MEDIASERVER_TYPE
              value: navidrome
            - name: NAVIDROME_URL
              value: http://navidrome:4533
            - name: NAVIDROME_USER
              value: audiomuse
            - name: AUDIOMUSE_USER
              value: admin
            - name: AUTH_ENABLED
              value: "True"
          volumeMounts:
            - name: temp-audio
              mountPath: /app/temp_audio
          resources:
            requests:
              cpu: 100m
              memory: 768Mi # 493 MiB in use on vm101, analysis jobs spike
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: temp-audio
          emptyDir: {}
