# The lab drive is mounted on chimaera at /mnt/lab (ansible/roles/k3s). Read-only
# is enforced by the PVC and the volumeMount, not here.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music
spec:
  capacity:
    storage: 100Gi # nominal, local PVs don't enforce it
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/lab/music
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [chimaera]
