# Job queue only; nothing here needs to survive a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-redis
  namespace: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiomuse-redis
  template:
    metadata:
      labels:
        app: audiomuse-redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-redis
  namespace: navidrome
spec:
  selector:
    app: audiomuse-redis
  ports:
    - port: 6379
      targetPort: 6379
