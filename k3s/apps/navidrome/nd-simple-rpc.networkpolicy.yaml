# The public port takes only Traefik: the login rate limit trusts the last
# X-Forwarded-For entry, which any other pod could forge by connecting
# directly. The internal port takes only Navidrome (the plugin) and the
# kubelet's probes, which arrive from the node's cni0 gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nd-simple-rpc-ingress
  namespace: navidrome
spec:
  podSelector:
    matchLabels:
      app: nd-simple-rpc
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels: { app: navidrome }
        - ipBlock: { cidr: 10.42.0.1/32 } # node gateway (kubelet probes)
      ports:
        - port: 8081
