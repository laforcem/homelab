apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-pg
  namespace: immich
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: immich-pg
    template:
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: d394f6e9-0830-48c6-bff7-b4ec0126daa4 # immich_pg_password
