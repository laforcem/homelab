# The lab drive is mounted on chimaera at /mnt/lab (ansible/roles/k3s).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 100Gi # nominal, local PVs don't enforce it
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/lab/immich
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [chimaera]
---
# External libraries (icloudpd's output). Mounted read-only by the release's
# advancedMounts, not here.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-icloud
spec:
  capacity:
    storage: 200Gi # nominal, local PVs don't enforce it
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/lab/icloud
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [chimaera]
