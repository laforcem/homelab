# Nightly logical backup, ahead of the 03:00 VolSync run. Writes to a temp
# file and renames, so a failed dump never replaces the last good one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump
  namespace: immich
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: pg-dump
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:41eacbe83eca995561fe43814fd4891e16e39632806253848efaf04d3c8a8b84
              command:
                - sh
                - -c
                - |
                  set -e
                  pg_dump -h postgres -U postgres -Fc -f /dump/immich.dump.tmp immich
                  mv /dump/immich.dump.tmp /dump/immich.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: dump
                  mountPath: /dump
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: dump
              persistentVolumeClaim:
                claimName: immich-dump
