apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-mcp
  namespace: actual
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: actual-mcp
    template:
      data:
        MCP_BRIDGE_PUBLIC_HOST: "budget.{{ .domain }}"
        ACTUAL_PASSWORD: "{{ .password }}"
        ACTUAL_BUDGET_SYNC_ID: "{{ .syncId }}"
        MCP_SSE_AUTHORIZATION: "{{ .sseAuth }}"
        # One token per OpenClaw agent, so actual-mcp logs which agent made each call.
        # "Default" is actual-mcp's registry name for the ACTUAL_BUDGET_SYNC_ID budget.
        MCP_STATIC_TOKENS: '{"moltron":{"tokenEnv":"MCP_TOKEN_MOLTRON","budgets":["Default"]},"moltrette":{"tokenEnv":"MCP_TOKEN_MOLTRETTE","budgets":["Default"]}}'
        MCP_TOKEN_MOLTRON: "{{ .tokenMoltron }}"
        MCP_TOKEN_MOLTRETTE: "{{ .tokenMoltrette }}"
  data:
    - secretKey: password
      remoteRef:
        key: f7101051-f052-4f4f-8c11-b4cf01582bbc
    - secretKey: syncId
      remoteRef:
        key: 93066b6e-5a0e-46bc-8bfb-b4cf01586f87
    - secretKey: sseAuth
      remoteRef:
        key: 88668fd6-dd3a-41fc-ba9e-b4cf01590732
    - secretKey: domain
      remoteRef:
        key: 4d3bfd3c-0a5d-496e-8eeb-b4ab00128f57
    - secretKey: tokenMoltron
      remoteRef:
        key: e91458b7-1e54-4452-9fb7-b50d004781e3
    - secretKey: tokenMoltrette
      remoteRef:
        key: 9db2f4b0-c2c9-4694-b323-b50d0047823c
