apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: actual
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: actual-actual-mcp-strip-prefix@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - budget.$DOMAIN
      secretName: budget-tls
  rules:
    - host: budget.$DOMAIN
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: actual-mcp
                port:
                  number: 3600
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 5006
