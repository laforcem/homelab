# Dead-man's-switch probe: pings the Healthchecks check only while ABS's
# /healthcheck answers; sends /fail otherwise. A missed run (cluster or
# CronJob down) lets the check time out. Ping URLs are not secret (same as
# the other committed hc-ping.com URLs).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-probe
  namespace: audiobookshelf
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: probe
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - |
                  if curl -fsS --max-time 10 -o /dev/null http://audiobookshelf/healthcheck; then
                    curl -fsS --retry 3 -o /dev/null https://hc-ping.com/c0e5191f-fe8a-4592-8f68-82681415e6aa
                  else
                    curl -fsS --retry 3 -o /dev/null https://hc-ping.com/c0e5191f-fe8a-4592-8f68-82681415e6aa/fail
                    exit 1
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
