# The lab drive is mounted on chimaera at /mnt/lab (ansible/roles/k3s).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-library
spec:
  capacity:
    storage: 100Gi # nominal, local PVs don't enforce it
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/lab/audiobooks
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [chimaera]
