apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  sourcePVC: audiobookshelf-data
  trigger:
    schedule: "15 3 * * *" # 15 min after actual
  restic:
    repository: restic-config
    copyMethod: Direct
    pruneIntervalDays: 15
    retain:
      daily: 7
      weekly: 4
      monthly: 3
