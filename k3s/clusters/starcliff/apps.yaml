---
# Deploys into the immich namespace, separately from Immich itself.
# wait: false because the local-path PVC stays Pending until the CronJob's
# first run mounts it, which would keep this Kustomization from going Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pinterest-immich
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  dependsOn:
    - name: flux-secrets
    - name: immich
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/apps/pinterest-immich
