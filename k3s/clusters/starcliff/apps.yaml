# One Kustomization per app: a broken app never blocks the others.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actual
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: flux-secrets
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/apps/actual
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-vars
