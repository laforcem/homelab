# One Kustomization per infra component. Order comes from dependsOn.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/infra/flux/secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  dependsOn:
    - name: flux-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/infra/flux/notifications
  postBuild:
    substitute:
      # A numeric chat ID would otherwise become an integer; Provider.channel is a string.
      quote: '"'
    substituteFrom:
      - kind: Secret
        name: flux-vars
---
# Helm releases for the monitoring namespace. monitoring-config waits for it:
# the CRDs it needs come from the kube-prometheus-stack release.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: flux-notifications
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/infra/monitoring/releases
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/infra/monitoring
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-vars
