name: doco-cd
# Single instance: deploys everything, including itself (SELF_UPDATE_ENABLED;
# its own stack is defined in the repo-root .doco-cd.yaml). The old
# doco-cd-updater instance is retired — see doco-cd's Self-Updating docs.

services:
  app:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.125.1
    restart: unless-stopped
    environment:
      TZ: America/Denver
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SELF_UPDATE_ENABLED: "true"
      SECRET_PROVIDER: bitwarden_sm
      SECRET_PROVIDER_ACCESS_TOKEN: ${SECRET_PROVIDER_ACCESS_TOKEN}
      POLL_CONFIG: |
        - url: https://github.com/laforcem/homelab.git
          reference: refs/heads/main
          interval: 300
          deployments:
            - name: doco-cd
              working_dir: compose/doco-cd
              compose_files:
                - compose.yaml
              env_files:
                - /secrets/doco-cd.env
            - name: adguard-home
              working_dir: compose/adguard-home
              compose_files:
                - compose.yaml
              external_secrets:
                DROPBOX_APP_KEY: "491fc480-9679-4992-a726-b4c601069133"
                DROPBOX_APP_SECRET: "1bd1d5a7-b2e6-4b49-870e-b4c60106b524"
                DROPBOX_REFRESH_TOKEN: "4466365a-c366-439d-b52c-b4c601089b7e"
            - name: music-assistant
              working_dir: compose/music-assistant
              compose_files:
                - compose.yaml
              external_secrets:
                DROPBOX_APP_KEY: "491fc480-9679-4992-a726-b4c601069133"
                DROPBOX_APP_SECRET: "1bd1d5a7-b2e6-4b49-870e-b4c60106b524"
                DROPBOX_REFRESH_TOKEN: "4466365a-c366-439d-b52c-b4c601089b7e"
            - name: caddy-lan
              working_dir: compose/caddy/warden
              compose_files:
                - compose.yaml
              external_secrets:
                DOMAIN: "4d3bfd3c-0a5d-496e-8eeb-b4ab00128f57"
                API_KEY: "05d378b9-de09-465c-80ec-b4ab001378de"
                SECRET_KEY: "e991c510-db7b-4e76-b885-b4ab00138c89"
            - name: speedtest
              working_dir: compose/speedtest
              compose_files:
                - compose.yaml
              external_secrets:
                APP_KEY: "aa224100-800d-4374-bbe3-b4c50183e67a"
                DROPBOX_APP_KEY: "491fc480-9679-4992-a726-b4c601069133"
                DROPBOX_APP_SECRET: "1bd1d5a7-b2e6-4b49-870e-b4c60106b524"
                DROPBOX_REFRESH_TOKEN: "4466365a-c366-439d-b52c-b4c601089b7e"
            - name: monitoring
              working_dir: compose/monitoring
              compose_files:
                - compose.yaml
              external_secrets:
                GRAFANA_ADMIN_PASSWORD: "174165f9-dc39-4ef1-8656-b4c50184ab41"
                DOMAIN: "4d3bfd3c-0a5d-496e-8eeb-b4ab00128f57"
                ADGUARD_EXPORTER_PASSWORD: "cb730d28-66b8-4ba3-ac75-b4e80158047a"
            - name: router-sync
              working_dir: compose/router-sync
              compose_files:
                - compose.yaml
              external_secrets:
                SSH_PRIVATE_KEY: "e161d8e8-4437-445e-9de7-b4c5017e30bf"
                AGH_PASSWORD: "0d135bea-e776-4677-a546-b4c5017fd9ce"
            - name: oci-backup
              working_dir: compose/oci-backup
              compose_files:
                - compose.yaml
              external_secrets:
                OCI_CLI_USER: "fc755bbc-3ae9-4af5-8a12-b4ab000eef25"
                OCI_CLI_TENANCY: "4e09e83c-3749-48bf-a5e3-b4ab000f1c6d"
                OCI_CLI_KEY_CONTENT: "8a9a02f2-1883-4a25-bc75-b4ab00101cde"
                COMPARTMENT_ID: "6039f4df-bec5-438a-9b72-b4ab0021c7a2"
                BOOT_VOLUME_ID: "4b5d7b03-572f-4859-b64a-b4ab00105cb1"
            - name: porkbun-ddns
              working_dir: compose/porkbun-ddns
              compose_files:
                - compose.yaml
              external_secrets:
                DOMAIN: "4d3bfd3c-0a5d-496e-8eeb-b4ab00128f57"
                SUBDOMAIN: "40832d03-e0d3-49e6-80b8-b4ab00135d22"
                API_KEY: "05d378b9-de09-465c-80ec-b4ab001378de"
                SECRET_KEY: "e991c510-db7b-4e76-b885-b4ab00138c89"
            - name: ppld-calendar
              working_dir: compose/ppld-calendar
              compose_files:
                - compose.yaml
              external_secrets:
                PPLD_CARD_NUMBER: "23779a68-949a-43df-af30-b4df01464ff8"
                PPLD_PIN: "334a64c3-e1e2-4ad6-80f8-b4df014673b9"
                CALDAV_USERNAME: "c6a154ff-d10e-4002-acad-b4df01468adf"
                CALDAV_APP_PASSWORD: "7a655d96-b72a-4734-8806-b4df01473b42"
                CALDAV_CALENDAR_URL: "8679ab16-75a4-40e6-83c8-b4df01477477"
            - name: icloudpd
              working_dir: compose/icloudpd
              compose_files:
                - compose.yaml
              external_secrets:
                APPLE_ID_MALC: "fb76e1f6-9a06-4e9e-ae00-b4ec01022ec9"
                APPLE_ID_GRUG: "04eb259b-8993-467b-a237-b4ec01022f13"
                APPLE_PASSWORD_MALC: "56a56b87-9799-4e6d-838a-b4ec01022f5e"
                APPLE_PASSWORD_GRUG: "7022bf83-d6ce-45bd-912c-b4ec01022fa0"
                TELEGRAM_BOT_TOKEN: "0000df5a-ef56-49d0-a10c-b4ec01022fe2"
                TELEGRAM_ALLOWED_CHAT_IDS: "48059eed-255a-440a-847d-b4ec01023021"
                DROPBOX_APP_KEY: "491fc480-9679-4992-a726-b4c601069133"
                DROPBOX_APP_SECRET: "1bd1d5a7-b2e6-4b49-870e-b4c60106b524"
                DROPBOX_REFRESH_TOKEN: "4466365a-c366-439d-b52c-b4c601089b7e"
    volumes:
      - data:/data
      - /opt/doco-cd-secrets:/secrets:ro
    cap_drop:
      - ALL
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:

networks:
  # Owned by proxy-compose.yaml (Ansible-provisioned, not redeployed here —
  # see #108: force-recreating docker-socket-proxy through itself races).
  internal:
    name: doco-cd_internal
    external: true
