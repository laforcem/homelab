name: docker-socket-proxy
# Deliberately its own Compose project (not "doco-cd") — sharing that name
# made doco-cd-updater's orphan cleanup treat this container as leftover
# from its own project and kill it every recreate. Provisioned once by
# Ansible, not redeployed by doco-cd-updater (see #108): doco-cd-updater
# force-recreates its "doco-cd" deployment on every poll, and
# force-recreating docker-socket-proxy while doco-cd talks through it to
# do so is an inherent race. Keeping the proxy out of that loop entirely
# means it only ever changes on a deliberate Ansible run.

services:
  docker-socket-proxy:
    container_name: docker-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    cap_drop:
      - ALL
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      EVENTS: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      DISTRIBUTION: 1
      POST: 1
      AUTH: 0
      BUILD: 1
      COMMIT: 0
      EXEC: 1
      PLUGINS: 0
      SESSION: 1
      GRPC: 1
      SWARM: 0
      SYSTEM: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

networks:
  internal:
    name: doco-cd_internal
    external: true
