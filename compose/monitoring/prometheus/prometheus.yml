global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Named node-exporter so the kube-prometheus-stack node dashboards
  # (which filter on job="node-exporter") also work for warden.
  - job_name: node-exporter
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          host: warden

  - job_name: cadvisor
    static_configs:
      - targets: ['monitoring-cadvisor:8080']
        labels:
          host: warden

  - job_name: adguard
    static_configs:
      - targets: ['monitoring-adguard-exporter:9618']

  # Tests run every 15 minutes, so a slower scrape loses nothing.
  - job_name: speedtest-tracker
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /prometheus
    static_configs:
      - targets: ['speedtest-tracker:80']

# Push the few series warden's alerts need to the cluster's Prometheus
# (NodePort 30090, which its NetworkPolicy opens to warden only). Alert rules
# and Alertmanager live there; see WardenNotReporting and WardenContainerDown
# in k3s/infra/monitoring/rules/alerts.prometheusrule.yaml.
remote_write:
  - url: http://192.168.40.10:30090/api/v1/write
    write_relabel_configs:
      - source_labels: [__name__, mountpoint]
        regex: 'up;.*|container_last_seen;.*|node_filesystem_(avail|size)_bytes;/'
        action: keep
      - regex: '__name__|job|instance|host|name|mountpoint|fstype|device'
        action: labelkeep
      # Name the host in alert text instead of host.docker.internal:9100.
      - source_labels: [host]
        regex: '(.+)'
        target_label: instance
