name: caddy

volumes:
  data:
    name: caddy-mrgutsy_data
  config:
    name: caddy-mrgutsy_config

services:
  caddy:
    build: ..
    container_name: caddy-mrgutsy
    environment:
      - DOMAIN
      - API_KEY
      - SECRET_KEY
      - EMAIL
      - TZ=America/Denver
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"  # HTTP for redirection
    volumes:
      - ./conf:/etc/caddy:ro
      - data:/data
      - config:/config
