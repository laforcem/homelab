networks:
  icloudpd:
    name: icloudpd
    driver: bridge

volumes:
  icloudpd_sessions:
    name: icloudpd_sessions

secrets:
  apple_id_malc:
    file: ./secrets/apple_id_malc.txt
  apple_id_grug:
    file: ./secrets/apple_id_grug.txt
  apple_password_malc:
    file: ./secrets/apple_password_malc.txt
  apple_password_grug:
    file: ./secrets/apple_password_grug.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_allowed_chat_ids:
    file: ./secrets/telegram_allowed_chat_ids.txt
  icloudpd_webui_external_url:
    file: ./secrets/icloudpd_webui_external_url.txt

services:
  icloudpd:
    container_name: icloudpd
    hostname: icloudpd
    image: ghcr.io/laforcem/icloudpd:v1.1.0
    networks:
      - icloudpd
    environment:
      - TZ=America/Denver
    restart: always
    ports:
      - "2011:2011"
    volumes:
      - icloudpd_sessions:/home/icloudpd/.pyicloud
      - /mnt/lab/icloud/malc:/data/malc
      - /mnt/lab/icloud/grug:/data/grug
      - ./config.yaml:/etc/icloudpd/config.yaml:ro
    secrets:
      - apple_id_malc
      - apple_id_grug
      - apple_password_malc
      - apple_password_grug

  icloudpd-telegram-bot:
    container_name: icloudpd-telegram-bot
    hostname: icloudpd-telegram-bot
    image: ghcr.io/laforcem/icloudpd-telegram-bot:v1.1.0
    networks:
      - icloudpd
    environment:
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - TELEGRAM_ALLOWED_CHAT_IDS_FILE=/run/secrets/telegram_allowed_chat_ids
      - ICLOUDPD_BASE_URL=http://icloudpd:2011
      - ICLOUDPD_WEBUI_EXTERNAL_URL_FILE=/run/secrets/icloudpd_webui_external_url
    secrets:
      - telegram_bot_token
      - telegram_allowed_chat_ids
      - icloudpd_webui_external_url
    restart: always
