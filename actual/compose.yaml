name: actual

networks:
  actual-caddy:
    name: actual-caddy

volumes:
  data:
  mcp_data:

services:
  actual_mcp:
    container_name: actual-mcp
    image: ghcr.io/agigante80/actual-mcp-server:0.9.3
    networks:
      - actual-caddy
    environment:
      - TZ=America/Denver
      - ACTUAL_SERVER_URL=http://actual:5006
      - ACTUAL_PASSWORD=${PASSWORD}
      - ACTUAL_BUDGET_SYNC_ID=${SYNC_ID}
      - MCP_SSE_AUTHORIZATION=${MCP_SSE_AUTHORIZATION}
      - MCP_BRIDGE_PUBLIC_HOST=mcp-budget.${DOMAIN}
      - MCP_BRIDGE_PUBLIC_SCHEME=https
      - MCP_BRIDGE_USE_TLS=true
    volumes:
      - mcp_data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3600/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      actual_server:
        condition: service_healthy

  actual_server:
    container_name: actual
    image: docker.io/actualbudget/actual-server:26.8.0
    networks:
      - actual-caddy
    # environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - data:/data
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
