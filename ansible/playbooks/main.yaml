# valet is managed by the Moltron repo; only its music mount is configured here.
- name: Configure all hosts
  hosts: all:!agent
  become: true
  roles:
    - common

- name: Configure utility host(s)
  hosts: utility
  become: true
  roles:
    - utility-services

- name: Configure k3s node(s)
  hosts: k3s
  become: true
  roles:
    - k3s
    - cert-manager

- name: Configure agent host(s)
  hosts: agent
  become: true
  roles:
    - valet-music
