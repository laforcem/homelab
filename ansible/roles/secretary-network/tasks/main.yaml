- name: Add Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: 0644

- name: Add Tailscale apt repo
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: 0644

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Resolve Tailscale auth key
  ansible.builtin.set_fact:
    tailscale_authkey_resolved: "{{ tailscale_authkey }}"
  no_log: true

- name: Start Tailscale (plain client, no subnet routing)
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey_resolved }}
      --hostname=secretary

- name: Allow OpenClaw gateway from trusted VLAN
  community.general.ufw:
    rule: allow
    from_ip: 192.168.10.0/24
    port: '18789'
    proto: tcp
    comment: OpenClaw gateway LAN pairing

- name: Allow OpenClaw mDNS discovery from trusted VLAN
  community.general.ufw:
    rule: allow
    from_ip: 192.168.10.0/24
    port: '5353'
    proto: udp
    comment: OpenClaw mDNS discovery
