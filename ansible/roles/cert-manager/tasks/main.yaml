- name: Add jetstack helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  delegate_to: localhost
  become: false

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "v1.21.2"
    release_namespace: cert-manager
    create_namespace: true
    kube_context: "{{ k3s_cluster_name }}"
    values:
      crds:
        enabled: true
      ingressShim:
        defaultIssuerName: letsencrypt
        defaultIssuerKind: ClusterIssuer
        defaultIssuerGroup: cert-manager.io
  delegate_to: localhost
  become: false

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ k3s_cluster_name }}"
      - wait
      - --for=condition=Available
      - deployment/cert-manager-webhook
      - -n
      - cert-manager
      - --timeout=120s
  delegate_to: localhost
  become: false
  changed_when: false

- name: Configure Traefik to redirect HTTP to HTTPS (bypassing ACME challenge paths)
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ k3s_cluster_name }}"
      - apply
      - -f
      - "-"
  args:
    stdin: "{{ lookup('template', 'traefik-helmchartconfig.yaml.j2') }}"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Apply Let's Encrypt ClusterIssuer (HTTP-01)
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ k3s_cluster_name }}"
      - apply
      - -f
      - "-"
  args:
    stdin: "{{ lookup('template', 'cluster-issuer.yaml.j2') }}"
  delegate_to: localhost
  become: false
  changed_when: true
