- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Set timezone
  community.general.timezone:
    name: America/Denver

- name: Enable systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Disable SSH password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: Restart sshd

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart sshd

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow all traffic on Tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Allow forwarded traffic in via Tailscale interface
  community.general.ufw:
    rule: allow
    route: true
    interface_in: tailscale0

- name: Allow forwarded traffic out via Tailscale interface
  community.general.ufw:
    rule: allow
    route: true
    interface_out: tailscale0

- name: Set default deny for incoming traffic
  community.general.ufw:
    default: deny
    direction: incoming

- name: Enable ufw
  community.general.ufw:
    state: enabled
