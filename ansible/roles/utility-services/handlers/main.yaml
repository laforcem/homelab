- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Reload systemd and restart watchdog timer
  ansible.builtin.systemd:
    name: docker-proxy-watchdog.timer
    daemon_reload: true
    state: restarted

- name: Reload systemd and restart Tailscale metrics timer
  ansible.builtin.systemd:
    name: tailscale-metrics.timer
    daemon_reload: true
    state: restarted
