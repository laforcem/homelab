- name: Add Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: 0644

- name: Add Tailscale apt repo
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: 0644

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Resolve Tailscale auth key
  ansible.builtin.set_fact:
    tailscale_authkey_resolved: "{{ tailscale_authkey }}"
  no_log: true

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Start Tailscale
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey_resolved }}
      --advertise-routes=192.168.10.0/24,192.168.40.0/24
      --hostname=constrainer

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: 0644

- name: Get dpkg arch
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Add Docker apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ dpkg_arch.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: 0644

- name: Install Docker and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add malc to Docker group
  ansible.builtin.user:
    name: malc
    groups: docker
    append: true
