- name: Install k3s
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -s - --tls-san {{ k3s_tls_san }}
  args:
    creates: /usr/local/bin/k3s

- name: Install NFS client — kubelet needs mount.nfs for NFS PersistentVolumes
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Allow kube API (6443) from LAN
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: 192.168.10.0/24

- name: Allow kube API (6443) from Tailscale range
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: 100.64.0.0/10

- name: Allow HTTP ingress (80) from anywhere — required for ACME HTTP-01 challenges
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS ingress (443) from anywhere
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

# The lab drive (media library, 456G XFS, a thin LV on pve's truelab pool).
# No nofail: if it's missing at boot, the mount unit fails visibly instead of
# local PVs silently landing on an empty /mnt/lab on the 32G root disk.
- name: Mount the lab drive
  ansible.posix.mount:
    path: /mnt/lab
    src: UUID=245490a9-3440-4deb-89ae-27ee6a42ce85
    fstype: xfs
    opts: defaults
    state: mounted

- name: Install NFS server — warden's icloudpd writes its library to the lab drive over NFS
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Export the lab drive's icloud/ to warden only
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "/mnt/lab/icloud 192.168.10.12(rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
    regexp: '^/mnt/lab/icloud\s'
    create: true
  register: lab_exports

- name: Re-export NFS shares
  ansible.builtin.command: exportfs -ra
  when: lab_exports.changed

# NFSv4 only (port 2049); rpcbind (111) isn't needed.
- name: Allow NFS (2049) from warden only
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: tcp
    src: 192.168.10.12

- name: Check k3s node readiness
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - -o
      - jsonpath={.items[0].status.conditions[?(@.type=="Ready")].status}
  register: k3s_node_ready
  changed_when: false

- name: Assert chimaera's k3s node is Ready
  ansible.builtin.assert:
    that: k3s_node_ready.stdout == "True"
    fail_msg: "chimaera's k3s node did not report Ready"

- name: Ensure local .kube directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch kubeconfig from chimaera
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true

- name: Point local kubeconfig at chimaera's DNS name
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ k3s_tls_san }}:6443"
  delegate_to: localhost
  become: false

- name: Name the cluster/context/user entries in the local kubeconfig
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: '^  name: default$'
      replace: "  name: {{ k3s_cluster_name }}"
    - regexp: '^    cluster: default$'
      replace: "    cluster: {{ k3s_cluster_name }}"
    - regexp: '^    user: default$'
      replace: "    user: {{ k3s_cluster_name }}"
    - regexp: '^current-context: default$'
      replace: "current-context: {{ k3s_cluster_name }}"
    - regexp: '^- name: default$'
      replace: "- name: {{ k3s_cluster_name }}"
  delegate_to: localhost
  become: false
