- name: Install k3s
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -s - --tls-san {{ k3s_tls_san }}
  args:
    creates: /usr/local/bin/k3s

- name: Allow kube API (6443) from LAN
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: 192.168.10.0/24

- name: Allow kube API (6443) from Tailscale range
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: 100.64.0.0/10

- name: Allow HTTPS ingress (443) from the DMZ subnet
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    src: 192.168.40.0/24

- name: Check k3s node readiness
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - -o
      - jsonpath={.items[0].status.conditions[?(@.type=="Ready")].status}
  register: k3s_node_ready
  changed_when: false

- name: Assert chimaera's k3s node is Ready
  ansible.builtin.assert:
    that: k3s_node_ready.stdout == "True"
    fail_msg: "chimaera's k3s node did not report Ready"

- name: Ensure local .kube directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch kubeconfig from chimaera
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true

- name: Point local kubeconfig at chimaera's DNS name
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ k3s_tls_san }}:6443"
  delegate_to: localhost
  become: false

- name: Name the cluster/context/user entries in the local kubeconfig
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: '^  name: default$'
      replace: "  name: {{ k3s_cluster_name }}"
    - regexp: '^    cluster: default$'
      replace: "    cluster: {{ k3s_cluster_name }}"
    - regexp: '^    user: default$'
      replace: "    user: {{ k3s_cluster_name }}"
    - regexp: '^current-context: default$'
      replace: "current-context: {{ k3s_cluster_name }}"
    - regexp: '^- name: default$'
      replace: "- name: {{ k3s_cluster_name }}"
  delegate_to: localhost
  become: false

- name: Get Windows user profile path (WSL interop)
  ansible.builtin.command: powershell.exe -NoProfile -Command "$env:USERPROFILE"
  register: windows_userprofile
  changed_when: false
  delegate_to: localhost
  become: false

- name: Convert Windows user profile path to a WSL path
  ansible.builtin.command:
    argv:
      - wslpath
      - -u
      - "{{ windows_userprofile.stdout | trim }}"
  register: windows_home_wsl
  changed_when: false
  delegate_to: localhost
  become: false

- name: Ensure Windows-side .kube directory exists
  ansible.builtin.file:
    path: "{{ windows_home_wsl.stdout | trim }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Copy kubeconfig to the Windows-side default location
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.kube/config"
    dest: "{{ windows_home_wsl.stdout | trim }}/.kube/config"
    mode: "0600"
    remote_src: true
    unsafe_writes: true
  delegate_to: localhost
  become: false
