name: speedtest

volumes:
  speedtest-influxdb:
  speedtest-tracker:
  speedtest-grafana:

networks:
  speedtest-internal:
  caddy-internal:
    name: caddy-internal
    external: true

services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    networks:
      - speedtest-internal
      - caddy-internal
    environment:
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - INFLUXDB_URL=http://speedtest-influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_BUCKET=speedtest
      - INFLUXDB_ORG=homelab
      - SPEEDTEST_SCHEDULE=*/15 * * * *
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - speedtest-tracker:/config
      - ./custom-cont-init.d:/custom-cont-init.d:ro

  influxdb:
    image: influxdb:2
    container_name: speedtest-influxdb
    restart: unless-stopped
    networks:
      - speedtest-internal
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=speedtest
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - DOCKER_INFLUXDB_INIT_RETENTION=2160h
    volumes:
      - speedtest-influxdb:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  speedtest-tracker-backup:
    container_name: speedtest-tracker-backup
    image: offen/docker-volume-backup:v2.49.0
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "30 3 * * *" # nightly, offset from PBS's 03:00 snapshot, adguard's 03:15, and B2's 04:30 sync
      TZ: "America/Denver" # crond defaults to UTC otherwise, 6h off from the schedule above
      BACKUP_FILENAME: "speedtest-tracker-config-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_PRUNING_PREFIX: "speedtest-tracker-config-"
      NOTIFICATION_LEVEL: "info" # ping on success too, not just failure
      NOTIFICATION_URLS: "generic+https://hc-ping.com/7f63c1a8-99e1-4a9a-a8b8-001783df159b"
      # From Bitwarden Secrets Manager via doco-cd's external_secrets
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN}
      # Not a secret — path, committed plain
      DROPBOX_REMOTE_PATH: "/Homelab/speedtest-tracker"
    volumes:
      - speedtest-tracker:/backup/speedtest-tracker-config:ro

  grafana:
    image: grafana/grafana:latest
    container_name: speedtest-grafana
    restart: unless-stopped
    networks:
      - speedtest-internal
      - caddy-internal
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SERVER_ROOT_URL=https://grafana.lan.${DOMAIN}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=homelab
    volumes:
      - speedtest-grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      influxdb:
        condition: service_healthy
