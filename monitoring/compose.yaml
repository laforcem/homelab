name: monitoring

# Warden's half of observability. The one Grafana lives here and queries three
# datasources: warden's own Prometheus, plus the cluster's Prometheus and Loki
# (chimaera NodePorts 30090/30100). Every connection starts on this side —
# nothing here is reachable from the DMZ. Plan: see k3s/infra/monitoring/README.md.

volumes:
  prometheus-data:
  grafana-data:

networks:
  # Shared with Caddy (so it can reach Grafana), speedtest-tracker, and
  # adguard-home (so Prometheus and the exporter can reach them).
  caddy-internal:
    name: caddy-internal
    external: true

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - caddy-internal
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    networks:
      - caddy-internal
    volumes:
      - /:/host:ro,rslave
      # Written by the tailscale-metrics systemd timer (ansible/roles/utility-services)
      - /var/lib/node-exporter/textfile:/textfile:ro
    mem_limit: 64m

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: monitoring-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    networks:
      - caddy-internal
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    mem_limit: 256m

  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.1
    container_name: monitoring-adguard-exporter
    restart: unless-stopped
    environment:
      ADGUARD_SERVERS: http://adguard-home
      # Its own AdGuard Home account (added to AdGuardHome.yaml by hand — AGH
      # has no UI for users). The password comes from Bitwarden via doco-cd.
      ADGUARD_USERNAMES: adguard-exporter
      ADGUARD_PASSWORDS: ${ADGUARD_EXPORTER_PASSWORD}
      INTERVAL: 30s
    networks:
      - caddy-internal
    mem_limit: 64m

  grafana:
    image: grafana/grafana:13.2.3
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.lan.${DOMAIN}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    networks:
      - caddy-internal
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 512m
